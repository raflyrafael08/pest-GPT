services:
  - type: web
    name: pest-control-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run db:generate && npm run build -w apps/api
    preDeployCommand: npm run prisma:migrate -w apps/api && npm run prisma:seed -w apps/api
    startCommand: npm run start -w apps/api
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: API_PORT
        value: 10000
      - key: GPS_OFFLINE_THRESHOLD_SEC
        value: 90
      - key: GPS_INTERVAL_SEC
        value: 4
      - key: GEOSPATIAL_DEFAULT_RADIUS_M
        value: 100
      - key: DATABASE_URL
        sync: false
      - key: WEB_URL
        fromService:
          name: pest-control-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: pest-control-web
    runtime: node
    plan: free
    buildCommand: npm install && npm run build -w apps/web
    startCommand: npm run start -w apps/web -- -H 0.0.0.0 -p $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_ORIGIN
        fromService:
          name: pest-control-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
